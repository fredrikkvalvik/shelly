doc = "development tasks for shelly itself"

# Dogfooding note: two of these defer to mise rather than calling go directly,
# and both times for a reason shelly cannot currently fix.
#
#   check  needs to run gofmt, then vet, then test, stopping on the first
#          failure. exec is a pipeline, not a sequence, and there is no && .
#   clean  needs to run at the project root. `rm -rf bin` from a subdirectory
#          would delete the wrong bin, and no stage can set its own directory.
#
# Everything below is likewise only correct from the repository root.

[cmd.build]
doc = "build shelly into bin/"
flag = [
  { spec = "-r --race", doc = "build with the race detector", pass = "-race" },
]
exec = [{ cmd = "go", argv = ["build", "%{race}", "-o", "bin/shelly", "."] }]

[cmd.test]
doc = "run the test suite"
arg = [
  { spec = "[pkg]", doc = "package pattern", default = "./..." },
]
# go spells its flags with one dash, which is exactly what pass is for: without
# it these would emit --race and --run
flag = [
  { spec = "-r --race",        doc = "enable the race detector",       pass = "-race" },
  { spec = "-v --verbose",     doc = "show every test",                pass = "-v" },
  { spec = "-n --run <regex>", doc = "only tests matching this regex", pass = "-run" },
  { spec = "-c --count <n>",   doc = "run each test this many times",  pass = "-count" },
]
exec = [{ cmd = "go", argv = ["test", "%{race}", "%{verbose}", "%{run}", "%{count}", "%{pkg}"] }]

[cmd.vet]
doc = "run go vet"
arg = [{ spec = "[pkg]", doc = "package pattern", default = "./..." }]
exec = [{ cmd = "go", argv = ["vet", "%{pkg}"] }]

[cmd.fmt]
doc = "list files that are not gofmt clean"
flag = [
  { spec = "-w --write", doc = "rewrite them in place", pass = "-w" },
]
exec = [{ cmd = "gofmt", argv = ["-l", "%{write}", "."] }]

[cmd.check]
doc = "gofmt, vet and test, the pre-commit gate"
# sequencing lives in mise: exec pipes, it does not chain
exec = [{ cmd = "mise", argv = ["run", "check"] }]

[cmd.clean]
doc = "remove build output"
# mise pins the working directory to the config root; a bare rm here would
# delete whichever bin/ happened to be next to you
exec = [{ cmd = "mise", argv = ["run", "clean"] }]
